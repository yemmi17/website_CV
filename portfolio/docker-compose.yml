version: '3.8'

services:
  portfolio:
    build: .
    ports:
      - "3000:80"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    
  # Для продакшн версии:
  portfolio-prod:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped